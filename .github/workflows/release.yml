name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag. Pick one, unless versionOverride is set.'
        required: true
        type: choice
        options:
        - '(pick one)'
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). The version becomes <bumped-core>-<channel>.<N>. Empty = stable release.'
        required: false
        type: string
        default: ''
      versionOverride:
        description: 'Exact version to release (e.g. 4.2.5), bypassing the bump from the latest tag. Leave bump at "(pick one)".'
        required: false
        type: string
        default: ''
      sourceRef:
        description: 'Git ref (tag, branch or SHA) to release from. Empty = the ref this run was started on.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver2: ${{ steps.minver.outputs.SemVer2 }}
      tag: ${{ steps.tagname.outputs.tag }}
      prerelease: ${{ steps.tagname.outputs.prerelease }}
      sourceSha: ${{ steps.sourcesha.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.sourceRef }}
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        stamp-version: 'false'
    - name: Resolve built commit SHA
      id: sourcesha
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: resolve-built-commit-sha-c775df1621.cs
    - name: Validate version inputs
      env:
        BUMP: ${{ inputs.bump }}
        PRE_RELEASE: ${{ inputs.preRelease }}
        VERSION_OVERRIDE: ${{ inputs.versionOverride }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: validate-version-inputs-2aad3ac3e2.cs
    - name: Compute version and tag
      if: inputs.bump != '(pick one)' && inputs.versionOverride == ''
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'
    - name: Resolve release tag
      id: tagname
      env:
        BUMP_TAG: ${{ steps.bump.outputs.tag }}
        BUMP_PRERELEASE: ${{ steps.bump.outputs.prerelease }}
        VERSION_OVERRIDE: ${{ inputs.versionOverride }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: resolve-release-tag-d98a6a5208.cs
    - name: Stamp version with MinVer
      id: minver
      uses: glennawatson/actions-common/.github/actions/minver@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        version-override: ${{ inputs.versionOverride != '' && inputs.versionOverride || steps.bump.outputs.version }}
  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          rid: win-x64
        - os: ubuntu-latest
          rid: linux-x64
        - os: macos-latest
          rid: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.build.outputs.sourceSha }}
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        stamp-version: 'false'
    - name: Publish self-contained AOT binary
      env:
        RID: ${{ matrix.rid }}
        VERSION: ${{ needs.build.outputs.semver2 }}
      uses: glennawatson/actions-common/.github/actions/run-command@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        command: dotnet
        arguments: |-
          publish
          src/ClaudeNim.Aot/ClaudeNim.Aot.csproj
          -c
          Release
          -f
          net11.0
          -r
          $RID
          -p:MinVerVersionOverride=$VERSION
          -o
          publish/$RID
        working-directory: .
    - name: Zip the published output
      env:
        RID: ${{ matrix.rid }}
        VERSION: ${{ needs.build.outputs.semver2 }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: zip-the-published-output-1cbb9cfd2b.cs
    - name: Upload platform archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-archive-${{ matrix.rid }}
        path: ClaudeConverter-*-${{ matrix.rid }}.zip
        if-no-files-found: error
  create-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Download platform archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: release-archive-*
        path: archives
        merge-multiple: true
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        stamp-version: 'false'
    - name: Install GitReleaseNoteGenerator
      uses: glennawatson/actions-common/.github/actions/run-command@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        command: dotnet
        arguments: |-
          tool
          install
          -g
          GitReleaseNoteGenerator
        working-directory: .
    - name: Generate release notes
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.build.outputs.semver2 }}
      uses: glennawatson/actions-common/.github/actions/run-command@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        command: git-release-notes
        arguments: |-
          --release-version
          $RELEASE_VERSION
          --output-file
          release-notes.md
        working-directory: .
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ needs.build.outputs.tag }}
        TARGET: ${{ needs.build.outputs.sourceSha }}
        TITLE: ${{ needs.build.outputs.semver2 }}
        PRERELEASE: ${{ needs.build.outputs.prerelease }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: create-github-release-c1548b341c.cs
