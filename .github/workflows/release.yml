name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release level for the new tag. Pick one, unless versionOverride is set.'
        required: true
        type: choice
        options:
        - '(pick one)'
        - major
        - minor
        - patch
      preRelease:
        description: 'Pre-release channel (e.g. beta, rc). The version becomes <bumped-core>-<channel>.<N>. Empty = stable release.'
        required: false
        type: string
        default: ''
      versionOverride:
        description: 'Exact version to release (e.g. 4.2.5), bypassing the bump from the latest tag. Leave bump at "(pick one)".'
        required: false
        type: string
        default: ''
      sourceRef:
        description: 'Git ref (tag, branch or SHA) to release from. Empty = the ref this run was started on.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semver2: ${{ steps.minver.outputs.SemVer2 }}
      tag: ${{ steps.tagname.outputs.tag }}
      prerelease: ${{ steps.tagname.outputs.prerelease }}
      sourceSha: ${{ steps.tagname.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.sourceRef }}
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        stamp-version: 'false'
    - name: Validate version inputs
      uses: glennawatson/actions-common/.github/actions/release-inputs-validate@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        bump: ${{ inputs.bump != '(pick one)' && inputs.bump || '' }}
        pre-release: ${{ inputs.preRelease }}
        version-override: ${{ inputs.versionOverride }}
    - name: Compute version and tag
      if: inputs.bump != '(pick one)' && inputs.versionOverride == ''
      id: bump
      uses: glennawatson/actions-common/.github/actions/compute-version-and-tag@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        bump: ${{ inputs.bump }}
        tag-prefix: ''
        pre-release-id: ${{ inputs.preRelease }}
        push-tag: 'false'
    - name: Resolve release tag
      id: tagname
      uses: glennawatson/actions-common/.github/actions/release-tag-resolve@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        bump-tag: ${{ steps.bump.outputs.tag }}
        bump-prerelease: ${{ steps.bump.outputs.prerelease }}
        version-override: ${{ inputs.versionOverride }}
        tag-prefix: ''
    - name: Stamp version with MinVer
      id: minver
      uses: glennawatson/actions-common/.github/actions/minver@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        version-override: ${{ inputs.versionOverride != '' && inputs.versionOverride || steps.bump.outputs.version }}
  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          rid: win-x64
        - os: ubuntu-latest
          rid: linux-x64
        - os: macos-latest
          rid: osx-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.build.outputs.sourceSha }}
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        stamp-version: 'false'
    - name: Publish self-contained AOT binary
      env:
        RID: ${{ matrix.rid }}
        VERSION: ${{ needs.build.outputs.semver2 }}
      shell: bash
      run: dotnet "publish" "src/ClaudeNim.Aot/ClaudeNim.Aot.csproj" "-c" "Release" "-f" "net11.0" "-r" "$RID" "-p:MinVerVersionOverride=$VERSION" "-o" "publish/$RID"
    - name: Zip the published output
      uses: glennawatson/actions-common/.github/actions/zip-build@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        source: publish/${{ matrix.rid }}
        output: ClaudeConverter-${{ needs.build.outputs.semver2 }}-${{ matrix.rid }}.zip
    - name: Upload platform archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-archive-${{ matrix.rid }}
        path: ClaudeConverter-*-${{ matrix.rid }}.zip
        if-no-files-found: error
  create-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Download platform archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: release-archive-*
        path: signed
        merge-multiple: true
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        stamp-version: 'false'
    - name: Install GitReleaseNoteGenerator
      shell: bash
      run: dotnet "tool" "install" "-g" "GitReleaseNoteGenerator"
    - name: Generate release notes
      env:
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.build.outputs.semver2 }}
      shell: bash
      run: git-release-notes "--release-version" "$RELEASE_VERSION" "--output-file" "release-notes.md"
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      uses: glennawatson/actions-common/.github/actions/github-release-create@381282a6137c4f3c099ff80d9ee909e5d262998a
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.build.outputs.tag }}
        target: ${{ needs.build.outputs.sourceSha }}
        title: ${{ needs.build.outputs.semver2 }}
        prerelease: ${{ needs.build.outputs.prerelease }}
        asset-glob: '*.zip'
...
