name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter, e.g. *ThinkTagParser* or *'
        type: string
        default: '*'
      revision:
        description: 'Commit to check out and measure. Empty measures the commit that triggered the run.'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 1
      DOTNET_CLI_USE_MSBUILD_SERVER: 0
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Setup .NET Environment
      uses: glennawatson/actions-common/.github/actions/dotnet-environment@4d538f76071ed73496cbf406cebe85e760fb734d # main
    - name: Checkout measured commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.revision }}
        path: bench
    - name: Run benchmarks
      env:
        FILTER: ${{ inputs.filter }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: run-benchmarks-a5157d6436.cs
    - name: Validate benchmark reports
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: validate-benchmark-reports-d4d2d9c924.cs
    - name: Publish results to run summary
      if: always()
      env:
        FILTER: ${{ inputs.filter }}
      uses: glennawatson/actions-common/.github/actions/run-csharp@4d538f76071ed73496cbf406cebe85e760fb734d # main
      with:
        shared-script: publish-results-to-run-summary-0e6e55f71b.cs
    - name: Upload benchmark reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: benchmark-reports
        path: benchmark-artifacts/**
        if-no-files-found: error
        retention-days: 30
