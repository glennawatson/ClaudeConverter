name: "CodeQL GitHub Actions"
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    branches: [main]
    paths: ['.github/**']
  schedule:
  - cron: '17 9 * * 2'
permissions: {}
concurrency:
  group: codeql-actions-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze-actions:
    name: Analyze GitHub Actions
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: glennawatson/actions-common/.github/workflows/workflow-common-codeql-actions.yml@315788024be8e61daa4f2b957e6476746211b522 # main
