name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and test
    uses: glennawatson/actions-common/.github/workflows/workflow-common-setup-and-build.yml@main
    with:
      solutionFile: claude-nim-aot-csharp.slnx
      minverTagPrefix: ''
      minverMinimumMajorMinor: '1.0'
      minverAutoIncrement: 'patch'
      dotnetVersions: |
        10.0.x
        11.0.x
